environment =   local1
environments{
        local1 {
               serenity.browser.maximized = true
               webdriver.driver = chrome
               chrome {
                 switches = [
                   "--start-maximized",
                   "--ignore-certificate-errors",
                   "--incognito",
                   "--remote-allow-origins=*",
                   "--accept-insecure-certs",
                   "--acceptSslCerts",
                   "--disable-popup-blocking"
                 ]
                 preferences {
                   download {
                     prompt_for_download: false
                     default_directory: "$TEMPDIR"
                   }
                 }
               }
             }

}